name: punzh_dict
description: Offline dictionary of Tver Karelian (Punzhina).
publish_to: "none"
version: 1.0.3+22

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  flutter_widget_from_html_core: ^0.15.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  http: ^1.6.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/dict.sqlite
    - assets/images/favicon.svg
    - assets/images/logo.svg

flutter_launcher_icons:
  android: true
  ios: true
  # Padded safe-zone asset (see assets/images/app_icon_launcher.png) so OEM
  # circle/squircle masks do not clip the ornament.
  image_path: assets/images/app_icon_launcher.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/app_icon_launcher.png
  adaptive_icon_foreground_inset: 8
